name: inis-eli

on:
  # UC TETIK, cunku BIRI YETMIYOR.
  # Olculdu 5 Agu: schedule CALISIYOR ama AGIR KISILIYOR — cron saatte 3 diyor,
  # gerceklesen ~saatte 1 (21:44 · 22:46 · 23:46 · 01:09 · 04:37Z), arada 3,5 saat bosluk.
  # push tetigi bu gecikmeyi anlamsizlastirir: koridora her dokunusta kuyruk bosalir.
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  # Ozyineleme YOK — GITHUB_TOKEN ile atilan push baska workflow tetiklemez (GitHub kurali).
  push:
    branches: [main]

concurrency:
  group: inis-eli
  # false KALIYOR — 5 Agu''da "asili kosu var" diye hipotez kurup true onerdim,
  # Actions sayfasi curuttu: son bes kosunun BESI de yesil ve zamanli. Asili kosu yok.
  # Olculmeden degistirilen ayar, olculmeden yazilan sayi kadar tehlikelidir.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN yeter — yukaridaki permissions: contents: write onu yazabilir yapiyor.
      # KORIDOR_PAT hic gerekmiyordu; koydugum icin kosum checkout'ta dustu (Onondaga, subtracted).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: kuyrugu cek, kapiyi uygula, dosyala
        id: cek
        env:
          SB_URL: https://rgnuvspudrwmfrdrefza.supabase.co
          SB_KEY: sb_publishable_JNCVDSNJqm1UIo01Jre_Ng_KwXKUHGJ
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, hashlib, pathlib, urllib.request, urllib.error

          AZAMI_DOSYA  = 40
          AZAMI_BAYT   = 512 * 1024
          AZAMI_TOPLAM = 4 * 1024 * 1024

          SIR = [
              re.compile(r"gh[pousr]_[A-Za-z0-9]{16,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"\bsk-[A-Za-z0-9]{16,}"),
              re.compile(r"eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              # "service_role" CIPLAK HALDE YASAK DEGIL — bu ev o kelimeyi surekli
              # TARTISIYOR (M-7 god-key kalemi tam olarak bu). Ciplak yasaklamak,
              # kendi guvenlik tartismamizin koridora inmesini engellerdi.
              # (Yakalayan: DUMAN, 4 Agu 18:35Z. Kusur Onondaga'nin.)
              re.compile(r"service_role\s*[:=]\s*\S{20,}"),
              # rev.6 — DUMAN 5 Agu 06:39Z: "sb_secret_ kapidan GECIYOR; bu evin
              # KENDI anahtar formati". Kapi baskasinin anahtarini yakaliyor,
              # kendi evininkini yakalamiyordu. Bir guvenlik kapisinin en kotu korlugu.
              re.compile(r"sb_secret_[A-Za-z0-9_\-]{16,}"),   # Supabase gizli anahtar
              re.compile(r"sbp_[a-f0-9]{40,}"),               # Supabase kisisel token
              re.compile(r"\b(AKIA|ASIA)[A-Z0-9]{16}\b"),     # AWS
              re.compile(r"xox[baprs]-[A-Za-z0-9-]{10,}"),    # Slack
              re.compile(r"AIza[A-Za-z0-9_\-]{30,}"),         # Google API
              re.compile(r"\bglpat-[A-Za-z0-9_\-]{16,}"),     # GitLab
              re.compile(r"(?i)\b(password|passwd|secret|api[_-]?key)\s*[:=]\s*\S{8,}"),
          ]

          def slug(s):
              s = s.lower()
              for a, b in zip("çğıöşüâîû", "cgiosuaiu"):
                  s = s.replace(a, b)
              s = re.sub(r"[^a-z0-9]+", "-", s).strip("-")
              return (s[:60] or "adsiz")

          url = (os.environ["SB_URL"] +
                 "/rest/v1/ev_defteri?tur=eq.inis&durum=eq.acik"
                 "&select=id,an,masa,baslik,govde,damga,kaynak&order=id.asc")
          key = os.environ["SB_KEY"]
          req = urllib.request.Request(url, headers={"apikey": key,
                                                     "Authorization": "Bearer " + key})
          try:
              rows = json.load(urllib.request.urlopen(req, timeout=30))
          except urllib.error.HTTPError as e:
              print("ALET ARIZASI · HTTP %s · %s" % (e.code, e.read()[:300]))
              sys.exit(2)
          except Exception as e:
              print("ALET ARIZASI · %s" % e)
              sys.exit(2)

          print("kuyrukta %d satir" % len(rows))
          if not rows:
              pathlib.Path("/tmp/inen").write_text("")
              sys.exit(0)

          # TAVAN BURADA UYGULANMAZ — asagida, YALNIZ FIILEN INENLERE uygulanir.
          # Onceden kirpsaydik: 40 satir zaten inmis ama hala 'acik' duruyorsa
          # butun kotayi ATLANDI'lar yer, 41. satir HIC INMEZ. Sessiz aclik.

          pathlib.Path("gelen").mkdir(exist_ok=True)
          inen, toplam = [], 0

          for r in rows:
              if len(inen) >= AZAMI_DOSYA:
                  print("KAPI: bu turda %d dosya indi, tavan dolu — kalani sonraki tura"
                        % AZAMI_DOSYA)
                  break
              govde = r.get("govde") or ""
              metin = (
                  "# %s\n\n"
                  "`masa:` **%s** · `an:` %s · `damga:` %s\n"
                  "`kaynak:` %s\n"
                  "`ev_defteri.id:` %s\n\n---\n\n%s\n"
                  % (r.get("baslik", "adsiz"), r.get("masa", "?"), r.get("an", "?"),
                     r.get("damga") or "—", r.get("kaynak") or "—", r["id"], govde)
              )
              ham = metin.encode("utf-8")

              red = None
              if len(ham) > AZAMI_BAYT:
                  red = "cok buyuk (%d B > %d)" % (len(ham), AZAMI_BAYT)
              elif toplam + len(ham) > AZAMI_TOPLAM:
                  red = "toplam tavan asildi"
              else:
                  for d in SIR:
                      if d.search(metin):
                          red = "sir kokusu: %s" % d.pattern[:28]
                          break

              if red:
                  print("RED · id=%s · %s" % (r["id"], red))
                  continue

              yol = pathlib.Path("gelen") / ("inis-%s-%s.md" % (r["id"], slug(r.get("baslik", ""))))
              if not str(yol).startswith("gelen/") or yol.suffix != ".md":
                  print("RED · id=%s · kapsam disi: %s" % (r["id"], yol))
                  continue

              # IDEMPOTANS — ayni ad, ayni bayt varsa hic dokunma.
              # Bu olmadan: satir 'acik' kaldigi icin her tur yeniden iniyor, .md ayni
              # oldugu icin diff cikmiyor AMA _INEN.md buyuyor -> 20 dakikada bir commit,
              # sonsuza kadar. (Yakalayan: Claude Code, 4 Agu 16:45Z.)
              if yol.exists() and yol.read_bytes() == ham:
                  print("ATLANDI · id=%s · zaten inmis, bayt ayni" % r["id"])
                  continue

              yol.write_bytes(ham)
              geri = yol.read_bytes()
              sha = hashlib.sha256(geri).hexdigest()[:16]
              if len(geri) != len(ham):
                  print("RED · id=%s · diskten geri okuma tutmadi" % r["id"])
                  yol.unlink()
                  continue

              toplam += len(ham)
              inen.append("%s\t%s\t%d\t%s\t%s" % (r["id"], yol.name, len(ham), sha, r.get("masa", "?")))
              print("INDI · id=%s · %s · %d B · %s" % (r["id"], yol.name, len(ham), sha))

          # HER SATIR KENDI SATIRSONUYLA biter. "\n".join olmaz: son satirda newline
          # kalmaz, bash'in `while read`'i onu okur ama DONGUDEN CIKAR -> her kosunun
          # SON belgesi makbuzsuz kalir = hayalet inis. Olculdu: 9 indi, makbuzda 8 vardi.
          pathlib.Path("/tmp/inen").write_text("".join(s + "\n" for s in inen))
          print("toplam inen: %d dosya, %d bayt" % (len(inen), toplam))
          PYEOF

      - name: makbuz yaz, isle, it
        run: |
          if [ ! -s /tmp/inen ]; then
            echo "inen yok — koridora dokunulmadi."
            exit 0
          fi
          {
            echo ""
            echo "## inis-eli · $(date -u '+%Y-%m-%dT%H:%M:%SZ') · run ${GITHUB_RUN_ID}"
            echo ""
            echo "| ev_defteri.id | dosya | bayt | sha16 | masa |"
            echo "|---|---|---|---|---|"
            while IFS=$'\t' read -r id ad bayt sha masa; do
              [ -n "$id" ] && echo "| $id | \`$ad\` | $bayt | \`$sha\` | $masa |"
            done < /tmp/inen
          } >> gelen/_INEN.md

          git config user.name  "inis-eli"
          git config user.email "inis-eli@users.noreply.github.com"
          git add gelen/
          git diff --cached --quiet && { echo "degisiklik yok"; exit 0; }
          git commit -m "inis-eli: $(wc -l < /tmp/inen) belge indi (run ${GITHUB_RUN_ID})"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "== koridor yeni basi:"
          git rev-parse --short HEAD
